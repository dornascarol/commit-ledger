services:
  postgres:
    image: postgres:16-alpine
    container_name: commitledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: commitledger
      POSTGRES_PASSWORD: commitledger
      POSTGRES_DB: commitledger
    ports:
      - "5432:5432"
    volumes:
      - commitledger-postgres-data:/var/lib/postgresql/data

volumes:
  commitledger-postgres-data:
